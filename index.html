<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andrii Vynohradov</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Inline Theme Script: Prevent FOUC / flicker -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('vynohradov-portfolio-theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Meta Information -->
    <meta name="author" content="Andrii Vynohradov" />
    <meta
      name="description"
      content="Portfolio of Andrii Vynohradov, Systems Architect & Low-Latency Engineer with expertise in C++20 real-time audio, distributed AI runtimes, embedded DSP, and WebAssembly topologies."
    />
    <meta
      name="keywords"
      content="Andrii Vynohradov, Systems Architect, Low-Latency C++, Real-Time Audio, DSP, Distributed AI Runtimes, Lock-Free SPSC, Embedded Firmware, WebAssembly, TypeScript, GitHub"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#007acc" />

    <!-- Social Media Open Graph -->
    <meta
      property="og:title"
      content="Andrii Vynohradov - Full Stack Web Developer"
    />
    <meta
      property="og:description"
      content="Portfolio of Andrii Vynohradov, a Full Stack Developer with over 5 years of experience in building scalable, efficient, and AI-driven web applications."
    />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:url" content="https://github.com/resonaura" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Andrii Vynohradov - Full Stack Web Developer"
    />
    <meta
      name="twitter:description"
      content="Portfolio of Andrii Vynohradov, a Full Stack Developer with expertise in MERN, .NET, AI, and mobile development."
    />
    <meta name="twitter:image" content="/icon.svg" />
  </head>

</html>
